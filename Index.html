<!DOCTYPE html>
<html>
  <head>
    <title>Dylan Search</title>
    <style>
      body {
        background: #111;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      input[type="text"] {
        padding: 10px;
        width: 300px;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 18px;
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        background: #00ffcc;
        color: black;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>DylanAI</h1>
    <form action="https://www.google.com/search" method="GET">
      <input type="text" name="q" placeholder="Search anything..." />
      <button type="submit">Go</button>
    </form>
  </body>
</html>
